# DeepSeek Harness (dsh) overlay for mneme — opt-in, default-off.
#
# mneme needs no dsh plugin: it is already a standard MCP server and dsh ships a
# generic MCP client (@deepseek-ai/dsh-mcp-client). This file only points that
# client at a mneme checkout. Copy it into your dsh config and edit the path.
#
# Unlike the overlays dsh ships in examples/mcp-memory, `command` here is `node`
# with an absolute script path rather than a bare executable: mneme is not
# published to npm with a `bin`, so there is nothing on PATH to invoke. Clone the
# repo, run `npm install`, and point args at that checkout.
#
# Two things that will silently give you a worse system if you skip them:
#
#   1. TOKENMEM_DB_PATH. Without it the DB is created relative to the process
#      working directory, so the store you build in one session can be invisible
#      from the next. Set it absolute.
#
#   2. EMBEDDING_API_*. Without these mneme starts fine and answers queries — as
#      FTS5 keyword search only. Hybrid recall (FTS + vector KNN fused by RRF) is
#      the reason to run mneme at all, and its absence is not an error, just a
#      quieter, worse result set. Recent builds warn once per process on the
#      degrade path; check stderr on first run if you are unsure which mode you
#      are in.
- insert:
    - id: memory-mneme
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: mneme
        transport: stdio
        command: node
        # EDIT THIS PATH to your mneme checkout.
        args: ['/absolute/path/to/mneme/mcp-server.mjs']
        cwd: !!js process.cwd()
        env:
          TOKENMEM_DB_PATH: !!js >-
            process.env.TOKENMEM_DB_PATH?.trim() || process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:os').homedir(), '.mneme', 'mneme.db')
          # Optional but strongly recommended — see note 2 above.
          EMBEDDING_API_BASE_URL: !!js process.env.EMBEDDING_API_BASE_URL ?? ''
          EMBEDDING_API_KEY: !!js process.env.EMBEDDING_API_KEY ?? ''
          EMBEDDING_MODEL: !!js process.env.EMBEDDING_MODEL ?? 'text-embedding-3-small'
          EMBEDDING_DIMENSION: !!js process.env.EMBEDDING_DIMENSION ?? '1536'
